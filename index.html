<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Learn guitar. Play what moves you. Private lessons built around real songs, clear technique, and steady progress."
    />
    <title>harishh.music - Learn guitar. Play what moves you.</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Netlify Forms: must exist in built HTML for detection -->
    <form
      name="enquiry"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      netlify
      hidden
    >
      <input type="hidden" name="form-name" value="enquiry" />
      <input name="bot-field" />
      <input name="name" type="text" />
      <input name="email" type="email" />
      <input name="interest" type="text" />
      <textarea name="message"></textarea>
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
