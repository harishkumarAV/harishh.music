<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Form detection</title>
  </head>
  <body>
    <!-- Static form for Netlify Forms detection (SPA). Do not remove. -->
    <form
      name="enquiry"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      netlify
      hidden
    >
      <input type="hidden" name="form-name" value="enquiry" />
      <input name="bot-field" />
      <input name="name" type="text" />
      <input name="email" type="email" />
      <select name="interest">
        <option value="demo">Demo class</option>
        <option value="beginner">8-Day Beginner Package (₹999)</option>
        <option value="custom">
          Customised Training - 8 classes / 1 month (₹1,499)
        </option>
      </select>
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
